name: Public content checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/content_policy.py
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
