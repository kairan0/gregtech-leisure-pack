# 是否显示大安培卡顿警告，这里主要是给gtl以外的整合包使用的配置项，默认为true。
# 如果你制作的整合包修复相关bug，且可以无障碍使用大安培电网仓，请设为false。
isDisplayNoFixCrashWarning: true

# 能量槽显示的格式
energyJadeFormatPartern: %s/%s

# 无线电网监视器净功率为0时显示的文本，不要太长！！！
WirelessEnergyMonitorZeroFormat: 0

# 默认是一般复制工具的100倍容量:100M
buildingGadgetMaxPower: 100000000

# 复制工具是否能建造AE线缆、终端等原先不能复制的东西（技术问题只能无消耗）
buildingGadgetBuildAE2: false

# 可配置流体仓、可配置总成的流体自动输入输出间隔（越小越快），默认：5
configurableFluidIOTick: 5

# 是否默认开启批处理
isBatchEnable: true

